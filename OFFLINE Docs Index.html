document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"18f5a4eb-3914-4b50-b6ca-d5572fbfb227\"><\u002Fscript>\n<style>\nbody{margin:0;font-family:Roboto,system-ui,sans-serif;color:#2c3e50;background:#fff;text-wrap:pretty}\na{color:#22706b}a:hover{color:#164f4b}\n*:focus-visible{outline:2px solid #22706b;outline-offset:2px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"min-height:100vh;background:linear-gradient(180deg,rgba(255,255,255,.45) 0px,rgba(255,255,255,.7) 420px,rgba(255,255,255,.9) 900px,#fff 1300px),url(&quot;627e9fbd-be68-4b89-be55-49cbb60e34c8&quot;) center 58px / cover no-repeat fixed;background-color:#fff\">\n  <header style=\"position:sticky;top:0;z-index:5;height:58px;display:flex;align-items:center;gap:24px;padding:0 24px;background:#fff;border-bottom:1px solid #eaecef\">\n    <a href=\"https://docs.offlineagency.com/\" style=\"display:flex;align-items:center;gap:12px;text-decoration:none;color:#2c3e50;margin-right:auto\">\n      <img src=\"d0225733-57ae-4976-a4b7-5a71be7d362a\" alt=\"OFFLINE\" style=\"height:32px;width:auto;display:block\">\n      <span style=\"font-size:18px\">Documentation<\u002Fspan>\n    <\u002Fa>\n    <nav style=\"display:flex;align-items:center;gap:22px;font-size:14px\">\n      <a href=\"#current\" style=\"color:#2c3e50;text-decoration:none\">Projects<\u002Fa>\n      <a href=\"#legacy\" style=\"color:#2c3e50;text-decoration:none\">Legacy<\u002Fa>\n      <a href=\"https://github.com/offline-agency\" style=\"color:#2c3e50;text-decoration:none\">GitHub ↗<\u002Fa>\n      <a href=\"https://offlineagency.it\" style=\"color:#2c3e50;text-decoration:none\">offlineagency.it ↗<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <section style=\"position:relative\">\n    <div style=\"position:relative;max-width:1280px;margin:0 auto;padding:96px 24px 72px\">\n      <h1 style=\"font-size:64px;font-weight:500;line-height:1.05;margin:0 0 16px;color:#1d2a36\">Docs<\u002Fh1>\n      <p style=\"font-size:22px;line-height:1.4;margin:0 0 28px;color:#2c3e50;max-width:30ch\">Open source project guides, with explicit release, source and compatibility information.<\u002Fp>\n      <p style=\"font-size:15px;line-height:1.6;margin:0;color:#3a4a5a;max-width:60ch\">We publish Laravel packages, Vue components and developer tools extracted from our application work. Compare each project's declared requirements with your platform before installing.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <main style=\"max-width:1280px;margin:0 auto;padding:0 24px\">\n    <section style=\"position:sticky;top:58px;z-index:4;margin-top:-28px;background:#fff;border:1px solid #e2e6ea;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.06);padding:16px;display:flex;flex-direction:column;gap:12px\">\n      <label style=\"display:flex;align-items:center;gap:10px;border:1px solid #cfd6dc;border-radius:4px;padding:0 12px;height:40px\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6a7a88\" stroke-width=\"2\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n        <input type=\"search\" placeholder=\"Search by name or feature, e.g. invoice, sms, vue\" value=\"{{ query }}\" sc-camel-on-input=\"{{ onQuery }}\" style=\"flex:1;border:0;outline:0;font:inherit;font-size:15px;color:#2c3e50;background:transparent\">\n      <\u002Flabel>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center\">\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n          <span style=\"font-size:12px;color:#6a7a88;margin-right:2px\">Status<\u002Fspan>\n          <sc-for list=\"{{ statusOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.checked }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;align-items:center\">\n          <span style=\"font-size:12px;color:#6a7a88;margin-right:2px\">Technology<\u002Fspan>\n          <sc-for list=\"{{ techOpts }}\" as=\"o\" hint-placeholder-count=\"4\">\n            <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" aria-pressed=\"{{ o.checked }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <span style=\"margin-left:auto;display:flex;gap:12px;align-items:center;font-size:13px;color:#4a5a68\">\n          <span>{{ countLabel }}<\u002Fspan>\n          <sc-if value=\"{{ filtered }}\" hint-placeholder-val=\"{{ false }}\"><button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"border:0;background:none;padding:0;font:inherit;color:#22706b;cursor:pointer;text-decoration:underline\">Reset<\u002Fbutton><\u002Fsc-if>\n        <\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ hasCurrent }}\" hint-placeholder-val=\"{{ true }}\">\n      <section id=\"current\" style=\"padding-top:48px;scroll-margin-top:220px\">\n        <h2 style=\"display:flex;align-items:baseline;gap:10px;font-size:24px;font-weight:500;margin:0;padding-bottom:12px;border-bottom:1px solid #eaecef;color:#1d2a36\">Current projects <span style=\"font-size:14px;font-weight:400;color:#6a7a88\">{{ currentCount }}<\u002Fspan><\u002Fh2>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:20px;padding-top:20px\">\n          <sc-for list=\"{{ current }}\" as=\"p\" hint-placeholder-count=\"9\">\n            <a href=\"{{ p.href }}\" style=\"display:flex;flex-direction:column;gap:10px;padding:16px;border:1px solid #eaecef;border-radius:6px;text-decoration:none;color:#2c3e50;background:#fff;transition:transform .2s,box-shadow .2s,border-color .2s\" style-hover=\"border-color:#9cc5c2;box-shadow:0 8px 22px rgba(34,112,107,.14);transform:translateY(-2px)\">\n              <span style=\"display:flex;align-items:center;justify-content:space-between;gap:8px\">\n                <span style=\"width:44px;height:44px;border-radius:8px;background:#e6f2f1;display:flex;align-items:center;justify-content:center;flex:none\">{{ p.icon }}<\u002Fspan>\n                <span style=\"font-size:12px;color:#6a7a88\">{{ p.tech }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"font-size:19px;font-weight:500;color:#22706b;word-break:break-word\">{{ p.name }}<\u002Fspan>\n              <span style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                <span style=\"{{ p.statusStyle }}\">{{ p.status }}<\u002Fspan>\n              <\u002Fspan>\n              <sc-if value=\"{{ showDesc }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"font-size:14px;line-height:1.55;color:#3a4a5a\">{{ p.desc }}<\u002Fspan><\u002Fsc-if>\n              <span style=\"margin-top:auto;padding-top:10px;border-top:1px solid #f0f2f4;display:flex;justify-content:space-between;gap:8px;font-size:13px\">\n                <span style=\"display:flex;flex-direction:column;gap:2px\">\n                  <span style=\"font-weight:500;color:#1d2a36;font-variant-numeric:tabular-nums\">{{ p.release }}<\u002Fspan>\n                  <span style=\"color:#6a7a88;text-align:left\">{{ p.req }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right\">\n                  <span style=\"display:flex;gap:10px;font-weight:500;color:#1d2a36;font-variant-numeric:tabular-nums\"><span>{{ p.dl }}<\u002Fspan><span style=\"display:flex;align-items:center;gap:3px\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#6a7a88\" stroke-width=\"2\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z\"><\u002Fpath><\u002Fsvg>{{ p.stars }}<\u002Fspan><\u002Fspan>\n                  <span style=\"color:#6a7a88\">downloads · stars<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fspan>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ hasLegacy }}\" hint-placeholder-val=\"{{ true }}\">\n      <section id=\"legacy\" style=\"padding-top:48px;scroll-margin-top:220px\">\n        <h2 style=\"font-size:24px;font-weight:500;margin:0;padding-bottom:12px;border-bottom:1px solid #eaecef;color:#1d2a36\">Legacy<\u002Fh2>\n        <sc-for list=\"{{ legacy }}\" as=\"p\" hint-placeholder-count=\"1\">\n          <a href=\"{{ p.href }}\" style=\"margin-top:20px;display:flex;flex-wrap:wrap;gap:12px 24px;padding:16px;border:1px solid #eaecef;border-left:0;border-radius:6px;background:#fafbfc;text-decoration:none;color:#2c3e50\" style-hover=\"border-color:#d5dbe0\">\n            <span style=\"flex:1 1 320px;display:flex;flex-direction:column;gap:8px\">\n              <span style=\"font-size:19px;font-weight:500;color:#22706b\">{{ p.name }}<\u002Fspan>\n              <span style=\"font-size:14px;line-height:1.55;color:#3a4a5a\">{{ p.desc }}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-start;font-size:13px\">\n              <span style=\"{{ p.statusStyle }}\">{{ p.status }}<\u002Fspan>\n              <span style=\"font-weight:500;font-variant-numeric:tabular-nums\">{{ p.release }}<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"padding:48px 0;margin:0;font-size:16px;color:#3a4a5a\">No projects match these filters. <button type=\"button\" sc-camel-on-click=\"{{ reset }}\" style=\"border:0;background:none;padding:0;font:inherit;color:#22706b;cursor:pointer;text-decoration:underline\">Reset filters<\u002Fbutton><\u002Fp>\n    <\u002Fsc-if>\n\n    <section id=\"why-open-source\" style=\"margin-top:64px;padding:32px;border:1px solid #eaecef;border-radius:6px;background:#f6faf9;display:flex;flex-direction:column;gap:24px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;max-width:62ch\">\n        <h2 style=\"display:flex;align-items:center;gap:14px;font-size:24px;font-weight:500;margin:0;color:#1d2a36\"><span style=\"width:44px;height:44px;border-radius:8px;background:#e6f2f1;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"#22706b\" stroke=\"#22706b\" stroke-width=\"1.7\" stroke-linejoin=\"round\" aria-hidden=\"true\"><g><path d=\"M12 20s-7.5-4.6-9-9.4C2 7.2 4.3 4.5 7.4 4.5c2 0 3.6 1.1 4.6 2.7 1-1.6 2.6-2.7 4.6-2.7 3.1 0 5.4 2.7 4.4 6.1C19.5 15.4 12 20 12 20z\"><\u002Fpath><animateTransform sc-camel-attribute-name=\"transform\" type=\"scale\" values=\"1;1.12;1;1.08;1\" sc-camel-key-times=\"0;.15;.3;.45;1\" dur=\"1.6s\" additive=\"sum\" sc-camel-repeat-count=\"indefinite\"><\u002FanimateTransform><animateTransform sc-camel-attribute-name=\"transform\" type=\"translate\" values=\"0 0;-1.44 -1.44;0 0;-.96 -.96;0 0\" sc-camel-key-times=\"0;.15;.3;.45;1\" dur=\"1.6s\" additive=\"sum\" sc-camel-repeat-count=\"indefinite\"><\u002FanimateTransform><\u002Fg><\u002Fsvg><\u002Fspan>Why we love open source<\u002Fh2>\n        <p style=\"font-size:16px;line-height:1.6;margin:0;color:#2c3e50\">Almost every project we deliver runs on open source: Laravel, Vue, PostgreSQL, MongoDB. Publishing the tools we extract from client work is how we give something back to the ecosystem we build on.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:20px 28px\">\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:2px solid #22706b\">\n          <h3 style=\"font-size:16px;font-weight:500;margin:0;color:#1d2a36\">Shared code gets better<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.6;margin:0;color:#3a4a5a\">Public packages are read, tested and reported on by developers outside our team. Bugs surface sooner, and every fix reaches all the projects that use the package.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:2px solid #22706b\">\n          <h3 style=\"font-size:16px;font-weight:500;margin:0;color:#1d2a36\">No lock-in for our clients<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.6;margin:0;color:#3a4a5a\">Clients can inspect, fork and maintain the code their product depends on, with or without us. Their software stays theirs.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;padding-top:14px;border-top:2px solid #22706b\">\n          <h3 style=\"font-size:16px;font-weight:500;margin:0;color:#1d2a36\">Claims you can verify<\u002Fh3>\n          <p style=\"font-size:14px;line-height:1.6;margin:0;color:#3a4a5a\">Open code makes documentation checkable. That is why every guide here states its exact release, source and known limits.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <a href=\"https://github.com/offline-agency\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:#fff;background:#22706b;padding:11px 18px;border-radius:4px;text-decoration:none\" style-hover=\"background:#164f4b;color:#fff\">Contribute on GitHub ↗<\u002Fa>\n        <a href=\"https://offlineagency.it/careers?utm_source=docs&amp;utm_medium=referral&amp;utm_campaign=opensource\" style=\"display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:#22706b;background:#fff;border:1px solid #9cc5c2;padding:10px 18px;border-radius:4px;text-decoration:none\" style-hover=\"background:#e6f2f1;color:#164f4b\">Work with us →<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"margin-top:48px;padding:20px 0;border-top:1px solid #eaecef;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:20px 32px;font-size:14px;line-height:1.6\">\n      <div>\n        <h3 style=\"font-size:13px;font-weight:500;margin:0 0 6px;color:#1d2a36\">How versions work<\u002Fh3>\n        <p style=\"margin:0;color:#3a4a5a\">Versions belong to each project, independently of VuePress. Each page identifies the exact source release.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <h3 style=\"font-size:13px;font-weight:500;margin:0 0 4px;color:#1d2a36\">Default compatibility lines<\u002Fh3>\n        <a href=\"#\">SPID v2<\u002Fa><a href=\"#\">Burger Menu v1<\u002Fa><a href=\"#\">pgr_dmmsy v0.1<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:2px\">\n        <h3 style=\"font-size:13px;font-weight:500;margin:0 0 4px;color:#1d2a36\">Archives and previews<\u002Fh3>\n        <a href=\"#\">Laravel Cart 4.0.3 archive<\u002Fa><a href=\"#\">Braintree next (unreleased)<\u002Fa><a href=\"#\">Moneta reference (unverified)<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section aria-label=\"Our work\" style=\"margin-top:48px;padding-top:28px;border-top:1px solid #eaecef;display:flex;flex-direction:column;gap:16px\">\n      <h2 style=\"font-size:13px;font-weight:500;margin:0;color:#6a7a88;letter-spacing:.04em;text-transform:uppercase\">From our work<\u002Fh2>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px\">\n        <a href=\"https://offlineagency.it/?utm_source=docs&amp;utm_medium=referral&amp;utm_campaign=r3ambiente\" style=\"display:flex;flex-direction:column;border:1px solid #eaecef;border-radius:6px;overflow:hidden;text-decoration:none;color:#2c3e50;background:#fff;transition:box-shadow .2s,border-color .2s\" style-hover=\"border-color:#9cc5c2;box-shadow:0 8px 22px rgba(34,112,107,.14)\">\n          <div style=\"position:relative;aspect-ratio:16/7;background:#1d2a36;overflow:hidden\">\n            <img src=\"https://r3ambiente.it/_nuxt/img/hero-3.f185fa0.png\" alt=\"Aerial view of a port construction site with cranes and containers\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block\">\n            <span style=\"position:absolute;left:16px;bottom:16px;background:#fff;border-radius:4px;padding:8px 10px;display:flex\"><img src=\"https://r3ambiente.it/_nuxt/img/r3ambiente-logo.df96432.svg\" alt=\"R3Ambiente\" style=\"height:22px;width:auto;display:block\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:18px;display:flex;flex-direction:column;gap:10px;flex:1\">\n            <span style=\"font-size:12px;color:#6a7a88\">A product by OFFLINE Agency<\u002Fspan>\n            <span style=\"font-size:20px;font-weight:500;color:#1d2a36;line-height:1.3\">Environmental monitoring for major infrastructure<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.6;color:#3a4a5a\">Web software to collect, validate and consult monitoring data before, during and after construction, on an integrated WebGIS, compliant with D.Lgs. 152/2006 and 104/2017.<\u002Fspan>\n            <span style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-size:12px;line-height:1;padding:5px 7px;border-radius:3px;background:#fff;color:#4a5a68;border:1px solid #d5dbe0\">WebGIS<\u002Fspan><span style=\"font-size:12px;line-height:1;padding:5px 7px;border-radius:3px;background:#fff;color:#4a5a68;border:1px solid #d5dbe0\">ARPA · ISPRA<\u002Fspan><span style=\"font-size:12px;line-height:1;padding:5px 7px;border-radius:3px;background:#fff;color:#4a5a68;border:1px solid #d5dbe0\">Digital twin<\u002Fspan><\u002Fspan>\n            <span style=\"margin-top:auto;padding-top:8px;display:flex\"><span style=\"font-size:14px;font-weight:500;color:#fff;background:#22706b;padding:9px 14px;border-radius:4px\">Discover how we built it →<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n        <a href=\"https://offlineagency.it/?utm_source=docs&amp;utm_medium=referral&amp;utm_campaign=urbanspaces\" style=\"display:flex;flex-direction:column;border:1px solid #eaecef;border-radius:6px;overflow:hidden;text-decoration:none;color:#2c3e50;background:#fff;transition:box-shadow .2s,border-color .2s\" style-hover=\"border-color:#9cc5c2;box-shadow:0 8px 22px rgba(34,112,107,.14)\">\n          <div style=\"position:relative;aspect-ratio:16/7;background:#1d2a36;overflow:hidden\">\n            <img src=\"https://urbanspaces.it/_nuxt/img/hero-rid.c4cb8da.jpg\" alt=\"Panoramic view of a town with green fields and mountains\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block\">\n            <span style=\"position:absolute;left:16px;bottom:16px;background:#fff;border-radius:4px;padding:8px 10px;display:flex\"><img src=\"https://urbanspaces.it/_nuxt/img/logo-urbanspaces.1bd9921.png\" alt=\"UrbanSpaces\" style=\"height:22px;width:auto;display:block\"><\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding:18px;display:flex;flex-direction:column;gap:10px;flex:1\">\n            <span style=\"font-size:12px;color:#6a7a88\">A product by OFFLINE Agency<\u002Fspan>\n            <span style=\"font-size:20px;font-weight:500;color:#1d2a36;line-height:1.3\">Integrated land management for public administrations<\u002Fspan>\n            <span style=\"font-size:14px;line-height:1.6;color:#3a4a5a\">One web application that brings together topographic, cadastral, address and planning data, used by 100+ municipalities and 1000+ users.<\u002Fspan>\n            <span style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-size:12px;line-height:1;padding:5px 7px;border-radius:3px;background:#fff;color:#4a5a68;border:1px solid #d5dbe0\">Cadastre<\u002Fspan><span style=\"font-size:12px;line-height:1;padding:5px 7px;border-radius:3px;background:#fff;color:#4a5a68;border:1px solid #d5dbe0\">Urban planning certificates<\u002Fspan><span style=\"font-size:12px;line-height:1;padding:5px 7px;border-radius:3px;background:#fff;color:#4a5a68;border:1px solid #d5dbe0\">With R3GIS<\u002Fspan><\u002Fspan>\n            <span style=\"margin-top:auto;padding-top:8px;display:flex\"><span style=\"font-size:14px;font-weight:500;color:#fff;background:#22706b;padding:9px 14px;border-radius:4px\">Discover how we built it →<\u002Fspan><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"padding:24px 0 40px;border-top:1px solid #eaecef;text-align:center;font-size:14px;color:#4a5a68\">© 2019 – 2026 <a href=\"https://offlineagency.it\">OFFLINE Agency<\u002Fa> | <a href=\"https://docs.offlineagency.com/\">Documentation<\u002Fa> | <a href=\"https://github.com/offline-agency\">GitHub<\u002Fa><\u002Ffooter>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showDescriptions&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nconst D = 'https://docs.offlineagency.com/';\nconst PROJECTS = [\n  { name: 'laravel-cart', slug: 'laravel-cart', tech: 'PHP', status: 'Maintained', release: 'v4.1.0', req: 'Laravel 12 / 13', desc: 'Shopping carts with VAT, coupons, atomic database mutations and opt-in guest transfer. Checkout tax limits documented.' },\n  { name: 'laravel-webex', slug: 'laravel-webex', tech: 'PHP', status: 'Maintained', release: 'v2.0.0', req: '', desc: 'Webex Meetings and Messaging APIs with per-request bearer tokens, typed results and guarded pagination.' },\n  { name: 'laravel-fatture-in-cloud-v2', slug: 'laravel-fatture-in-cloud-v2', tech: 'PHP', status: 'Maintained', release: 'v3.0.1', req: 'API v2', desc: 'Fatture in Cloud API v2 wrapper. Company configuration, typed results and implemented endpoint c
